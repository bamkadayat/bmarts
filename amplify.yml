version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
    build:
      commands:
        - echo "Setting up environment variables..."
        - env | grep -e DATABASE_URL -e JWT_SECRET -e GMAIL_USER -e GMAIL_PASS -e NEXT_PUBLIC_APP_URL >> .env.production
        - echo "Generating Prisma Client..."
        - npx prisma generate
        - echo "Prisma Client Generated."
        - echo "Running Prisma Migrations..."
        - yarn run prisma:migrate
        - echo "Prisma Migrations Completed."
        - echo "Building Next.js application..."
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  env:
    variables:
      DATABASE_URL: "$DATABASE_URL"
      JWT_SECRET: "$JWT_SECRET"
      GMAIL_USER: "$GMAIL_USER"
      GMAIL_PASS: "$GMAIL_PASS"
      NEXT_PUBLIC_APP_URL: "$NEXT_PUBLIC_APP_URL"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME"
      NEXT_PUBLIC_CLOUDINARY_API_KEY: "$NEXT_PUBLIC_CLOUDINARY_API_KEY"
      NEXT_PUBLIC_CLOUDINARY_API_SECRET: "$NEXT_PUBLIC_CLOUDINARY_API_SECRET"
      CLOUDINARY_API_KEY: "$CLOUDINARY_API_KEY"
      CLOUDINARY_API_SECRET: "$CLOUDINARY_API_SECRET"
      CLOUDINARY_UPLOAD_PRESET: "$CLOUDINARY_UPLOAD_PRESET"
      NEXT_PUBLIC_STRIPE_PUBLIC_KEY: "$NEXT_PUBLIC_STRIPE_PUBLIC_KEY"
      STRIPE_SECRET_KEY: "$STRIPE_SECRET_KEY"
      STRIPE_WEBHOOK_SECRET: "$STRIPE_WEBHOOK_SECRET"
